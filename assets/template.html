<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sitrep — {DATE}</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a22; --panel2:#1b222d; --line:#28303d;
    --text:#e8eef5; --dim:#93a1b3; --faint:#5c6a7d;
    --red:#f2555a; --amber:#f0a13c; --blue:#4da3ff; --green:#3fb970; --purple:#b18cff; --teal:#39c5bb;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:28px clamp(16px,4vw,48px) 60px}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin-bottom:8px}
  h1{font-size:30px;letter-spacing:4px;font-weight:800}
  h1 .dot{color:var(--amber)}
  .date{color:var(--dim);font-family:var(--mono);font-size:14px}
  /* ---- top stat blocks ---- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0 30px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stat b{display:block;font-size:26px;font-weight:800;font-family:var(--mono)}
  .stat span{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:1px}
  .stat.hot b{color:var(--red)} .stat.warn b{color:var(--amber)} .stat.ok b{color:var(--green)} .stat.info b{color:var(--blue)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:2.5px;color:var(--dim);margin:34px 0 14px;border-bottom:1px solid var(--line);padding-bottom:8px}
  /* ---- decision cards ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--faint);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .card.risk-high{border-left-color:var(--red)}
  .card.risk-med{border-left-color:var(--amber)}
  .card.risk-low{border-left-color:var(--blue)}
  .card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .repo{font-weight:800;font-size:17px}
  .badge{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--dim);background:var(--panel2)}
  .badge.parked{border-color:var(--amber);color:var(--amber)}   /* repo sitting on a non-main branch */
  .risk{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:1.5px;padding:3px 8px;border-radius:4px}
  .risk-high .risk{background:rgba(242,85,90,.15);color:var(--red)}
  .risk-med .risk{background:rgba(240,161,60,.15);color:var(--amber)}
  .risk-low .risk{background:rgba(77,163,255,.15);color:var(--blue)}
  .what{color:var(--dim);font-size:13.5px}
  /* dirty-tree meter: width % ≈ min(100, dirty+untracked files) */
  .meter{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .meter .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--amber),var(--red))}
  .meter.calm .fill{background:var(--blue)}
  .meter-label{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:-4px}
  /* unpushed commits shown as dots */
  .commits{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .cdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--purple);margin-right:3px;vertical-align:middle}
  /* branch lanes: a mini git graph — vertical rail + one lane per branch */
  .branches{position:relative;padding-left:16px;display:flex;flex-direction:column;gap:5px}
  .branches::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .branch{position:relative;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px}
  .branch::before{content:"";position:absolute;left:-12px;top:50%;width:9px;height:2px;background:var(--line)}
  .bdot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none;margin-left:-16px;outline:3px solid var(--panel)}
  .bdot.cur{background:var(--green)}          /* checked-out branch */
  .bdot.ahead{background:var(--purple)}       /* has unpushed commits */
  .bdot.local{background:var(--amber)}        /* no upstream — exists only on this disk */
  .bdot.gone{background:var(--red)}           /* upstream deleted */
  .track{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:4px;color:var(--dim);background:var(--panel2)}
  .track.ahead{color:var(--purple)} .track.local{color:var(--amber)} .track.gone{color:var(--red)} .track.sync{color:var(--green)} .track.cur{color:var(--green)}
  /* stash: dashed = orphaned work not attached to any branch */
  .stash{border:1px dashed var(--amber);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:12.5px;color:var(--amber);background:rgba(240,161,60,.06)}
  .rec{border-top:1px solid var(--line);padding-top:9px;font-size:13.5px}
  .rec b{color:var(--green)}
  /* ---- roadmap ---- */
  .roadmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
  .ritem{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;display:flex;gap:10px;align-items:baseline}
  .rtag{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--teal);border:1px solid var(--teal);border-radius:4px;padding:1px 7px;flex:none}
  .ritem .src{color:var(--faint);font-size:12px;font-family:var(--mono)}
  .ritem.midflight{border-style:dashed;border-color:var(--purple)}
  .ritem.midflight .rtag{color:var(--purple);border-color:var(--purple)}
  /* ---- quiet + housekeeping ---- */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-family:var(--mono);font-size:12.5px;color:var(--green);border:1px solid rgba(63,185,112,.35);border-radius:20px;padding:3px 11px;background:rgba(63,185,112,.06)}
  .house{list-style:none;display:flex;flex-direction:column;gap:8px}
  .house li{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-size:13.5px;color:var(--dim)}
  .house li b{color:var(--text)}
  .house li.alert{border-left:3px solid var(--red)}
  footer{margin-top:40px;color:var(--faint);font-size:12px;font-family:var(--mono)}
</style>
</head>
<body>

<header><h1>SITREP<span class="dot">.</span></h1><div class="date">{DATE} · {ROOT}</div></header>

<!-- Totals: repos scanned / need decision / unpushed commits / stashes / clean.
     Classes: hot(red) warn(amber) info(blue) ok(green) -->
<div class="stats">
  <div class="stat"><b>{N}</b><span>repos scanned</span></div>
  <div class="stat hot"><b>{N}</b><span>need a decision</span></div>
  <div class="stat info"><b>{N}</b><span>unpushed commits</span></div>
  <div class="stat warn"><b>{N}</b><span>stashes at risk</span></div>
  <div class="stat ok"><b>{N}</b><span>clean &amp; synced</span></div>
</div>

<h2>Needs a decision — ordered by work at risk</h2>
